name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "README.md", "NOTICE.md", "LICENSE" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up JDK 24
      uses: actions/setup-java@v5
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK and accept licenses
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"

    - name: Build (single ABI, low memory)
      run: |
        chmod +x gradlew
        set -o pipefail
        ./gradlew :app:assembleFullpermDebug \
          --no-daemon --max-workers=2 \
          -Pabis=arm64-v8a \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
          -Dorg.gradle.parallel=false \
          -Pkotlin.daemon.jvmargs=-Xmx1536m 2>&1 | tee build.log

    - name: Report errors
      if: failure()
      run: |
        python3 - <<'PY'
        import re
        t = open('build.log', errors='replace').read().splitlines()
        keep = []
        for i, l in enumerate(t):
            if re.search(r'What went wrong', l):
                keep += t[i:i + 8]
            elif re.search(r'^e: |error:|Unresolved reference|Execution failed|Could not |Caused by', l):
                keep.append(l)
        seen = []
        for l in keep:
            if l not in seen:
                seen.append(l)
        msg = '\n'.join(seen[:70])[:7000]
        msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
        print('::error title=Gradle errors::' + msg)
        PY

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: seal-vpn-debug
        path: app/build/outputs/apk/fullperm/debug/*.apk
        retention-days: 3
        if-no-files-found: error
